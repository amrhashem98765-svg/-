<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا | النادي الطلابي </title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1>النادي الطلابي </h1>
            <nav>
                <a href="index.html">الرئيسية</a>
                <a href="about.html">من نحن</a>
                <a href="contact.html" class="active">تواصل معنا</a>
            </nav>
        </div>
    </header>

    <main class="content-section">
        <div class="container">
            <h3>أرسل لنا رسالة</h3>
            <div class="contact-form">
                <form id="contactForm"> 
                    <input type="text" id="fullName" placeholder="الاسم الكامل" required>
                    <input type="email" id="emailAddress" placeholder="البريد الإلكتروني الجامعي" required>
                    <textarea id="messageBody" placeholder="رسالتك أو استفسارك..." required></textarea>
                    <button type="button" id="sendMailButton" class="button">إرسال الرسالة</button>
                </form>
            </div>
            
            <br>
            <h3>معلومات الاتصال المباشرة</h3>
            <p>📧 الإيميل الرسمي: amrhashem98765@gmail.com</p>
            <p>📞 +هاتف: 967739135028</p>
            <p>📍 الموقع: مبنى الأنشطة الطلابية - الدور الثالث، مكتب رقم 305.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 النادي الطلابي . جميع الحقوق محفوظة.</p>
    </footer>

    <script>
        document.getElementById('sendMailButton').addEventListener('click', function() {
            // 1. استخلاص البيانات من الحقول
            const name = document.getElementById('fullName').value;
            const email = document.getElementById('emailAddress').value;
            const message = document.getElementById('messageBody').value;

            // 2. التحقق من أن الحقول المطلوبة ليست فارغة (تحقق أساسي)
            if (!name || !email || !message) {
                alert('الرجاء تعبئة جميع الحقول المطلوبة.');
                return; 
            }

            // 3. تحديد البريد الإلكتروني المستلم (البريد الرسمي للنادي)
            const recipient = 'amrhashem98765@gmail.com'; 
            
            // 4. تحديد موضوع الرسالة
            const subject = `استفسار جديد من النادي الطلابي - ${name}`;

            // 5. بناء محتوى الرسالة، وتم وضع معلومات المستخدم في النص
            const emailBody = 
                `الاسم الكامل: ${name}\n` +
                `البريد الإلكتروني: ${email}\n\n` +
                `نص الرسالة:\n${message}`;

            // 6. بناء الرابط mailto: وتشفير المحتوى ليتوافق مع الروابط (URL Encoding)
            const mailtoLink = 
                `mailto:${recipient}` +
                `?subject=${encodeURIComponent(subject)}` +
                `&body=${encodeURIComponent(emailBody)}`;

            // 7. فتح تطبيق البريد الإلكتروني الخاص بالمستخدم
            window.location.href = mailtoLink;
        });
    </script>
</body>
</html>
